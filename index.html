<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/img/logoOnigashimaStore.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onigashima Store - Tu destino para coleccionables y más</title>
    <meta name="description" content="Bienvenido a Onigashima Store, tu tienda especializada en figuras, coleccionables y artículos exclusivos de anime y cultura pop." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://onigashima-store.vercel.app/" />
    <meta property="og:title" content="Onigashima Store - Coleccionables y figuras" />
    <meta property="og:description" content="Explora nuestra exclusiva selección de figuras y coleccionables. Calidad y autenticidad en cada pieza para tu colección." />
    <!-- IMPORTANTE: LinkedIn requiere URL absoluta para la imagen -->
    <meta property="og:image" content="https://onigashima-store.vercel.app/onigashima-store.png" />
    <meta property="og:image:secure_url" content="https://onigashima-store.vercel.app/onigashima-store.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Logotipo de Onigashima Store con productos coleccionables" />
    <!-- Dimensiones recomendadas para LinkedIn -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://onigashima-store.vercel.app/" />
    <meta property="twitter:title" content="Onigashima Store" />
    <meta property="twitter:description" content="Tu tienda especializada en figuras y coleccionables exclusivos." />
    <meta property="twitter:image" content="https://onigashima-store.vercel.app/onigashima-store.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
